# ATLAS nginx vhost — republic.suezcanal.xyz → 127.0.0.1:3001
# This is a SEPARATE file from /etc/nginx/sites-available/seacommons
# SeaCommons: api.seacommons.suezcanal.xyz → 127.0.0.1:8000 (untouched)
#
# Install: sudo cp ops/nginx-atlas.conf /etc/nginx/sites-available/atlas
#          sudo ln -s /etc/nginx/sites-available/atlas /etc/nginx/sites-enabled/atlas
#          sudo nginx -t && sudo systemctl reload nginx
# SSL:     sudo certbot --nginx -d republic.suezcanal.xyz

server {
    listen 80;
    server_name republic.suezcanal.xyz;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cron endpoint — localhost only (called by system cron, not browser)
    location /api/cron/ {
        allow 127.0.0.1;
        deny  all;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # API routes
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Everything else (app + static assets via Next.js)
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 5m;
    }

    access_log /var/log/nginx/atlas-access.log;
    error_log  /var/log/nginx/atlas-error.log warn;
}
